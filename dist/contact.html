<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Alex Morgan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/main-DUzjz-J-.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/main-BzHuYv8v.css">
</head>
<body>

  <main class="container" style="padding-top: 140px;">
    <!-- Contact Form Section -->
    <section class="section" style="padding-top: 0;">
      <div class="contact-wrap">
        <div class="section-title-wrap hero-fade-up" style="text-align: center; align-items: center; margin-bottom: 36px;">
          <div class="badge">Let's Connect</div>
          <h1 class="hero-name" style="font-size: clamp(2.5rem, 5vw, 4rem); display: block;">
            <span class="reveal-blur">Start a Project</span>
          </h1>
          <p class="section-desc" style="text-align: center;">Have a vision for your product? Leave a message and let's bring it to life.</p>
        </div>

        <form id="contact-form" class="hero-carousel-fade-up">
          <div class="form-group">
            <label class="form-label" for="name">Your Name</label>
            <input class="form-input" type="text" id="name" required placeholder="Alex Johnson" />
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Your Email</label>
            <input class="form-input" type="email" id="email" required placeholder="alex@company.com" />
          </div>
          <div class="form-group">
            <label class="form-label" for="message">Project Information</label>
            <textarea class="form-textarea" id="message" required placeholder="Tell me about your project, timeline, and goals..."></textarea>
          </div>
          <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 12px;">
            <span>Submit Message</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </form>
      </div>
    </section>

    <!-- FAQ Section -->
    <section class="section">
      <div class="section-title-wrap" style="margin-bottom: 48px; text-align: center; align-items: center;">
        <div class="badge">Frequently Asked Questions</div>
        <h2 class="section-subtitle reveal-blur">Got Questions?</h2>
      </div>
      <div id="faq-list" class="faq-list"></div>
    </section>
  </main>

</body>
</html>
